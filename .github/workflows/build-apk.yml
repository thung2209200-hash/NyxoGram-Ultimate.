
name: Build NyxoGram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o *.zip -d project

      - name: Find project and build APK
        run: |
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          ROOT=$(dirname "$ROOT")
          echo "Project directory: $ROOT"
          gradle -p "$ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NyxoGram-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
